name: Apple collector tests
on:
  push:
    paths:
      - "collector/**"
      - ".github/workflows/apple-collector-tests.yml"
      - ".github/workflows/apple-test-dataset.yml"
  pull_request:
    paths:
      - "collector/**"
      - ".github/workflows/apple-collector-tests.yml"
      - ".github/workflows/apple-test-dataset.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test offline fixtures
        run: python -m unittest discover -s tests -v
