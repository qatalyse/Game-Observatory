name: Import saved HoYoverse Apple history

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful manual targeted-export run ID"
        required: true
        type: string
        default: "44489555279"
      collection_date:
        description: "Original Singapore collection date (YYYY-MM-DD)"
        required: true
        type: string
        default: "2026-11-19"
      publish_to_sheets:
        description: "Upload the validated historical snapshot to Sheets"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

# Serialize historical writes with the existing daily publisher.
concurrency:
  group: apple-hoyoverse-daily-sheets
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_run_id: ${{ steps.source.outputs.source_run_id }}
      source_attempt: ${{ steps.source.outputs.source_attempt }}
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test offline fixtures
        run: python -m unittest discover -s tests -v
      - name: Verify the source run belongs to this manual exporter
        id: source
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen
          from game_observatory.apple_history import positive_id, source_details

          run_id = positive_id(os.environ["SOURCE_RUN_ID"], "Source run ID")
          repo = os.environ["GITHUB_REPOSITORY"]
          request = Request(
              f"https://api.github.com/repos/{repo}/actions/runs/{run_id}",
              headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                       "Accept": "application/vnd.github+json",
                       "X-GitHub-Api-Version": "2022-11-28",
                       "User-Agent": "GameObservatory-history-import"},
          )
          with urlopen(request, timeout=30) as response:
              raw = response.read(1_000_001)
          if len(raw) > 1_000_000:
              raise ValueError("Source run metadata exceeds the size limit")
          details = source_details(json.loads(raw), repo, run_id)
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              for key, value in details.items():
                  output.write(f"{key}={value}\n")
          print(json.dumps(details))
          PY
      - name: Download saved rankings from the source run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.source_run_id }}
          name: ${{ steps.source.outputs.rankings_artifact }}
          path: collector/data/apple-history
      - name: Download saved chart statuses from the source run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.source_run_id }}
          name: ${{ steps.source.outputs.statuses_artifact }}
          path: collector/data/apple-history
      - name: Validate the original date, source, roster and schemas without Google
        env:
          SOURCE_RUN_ID: ${{ steps.source.outputs.source_run_id }}
          SOURCE_ATTEMPT: ${{ steps.source.outputs.source_attempt }}
          COLLECTION_DATE: ${{ inputs.collection_date }}
        run: >-
          python -m game_observatory.apple_history --input data/apple-history
          --source-run-id "$SOURCE_RUN_ID" --source-attempt "$SOURCE_ATTEMPT"
          --collection-date "$COLLECTION_DATE"
      - name: Retain validated CSVs for the publishing job
        uses: actions/upload-artifact@v4
        with:
          # Stable across attempts so retrying only publish can reuse preparation.
          name: apple-hoyoverse-history-${{ github.run_id }}
          path: |
            collector/data/apple-history/apple_hoyoverse_rankings.csv
            collector/data/apple-history/apple_hoyoverse_chart_statuses.csv
          overwrite: true
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: prepare
    if: >-
      needs.prepare.result == 'success' && inputs.publish_to_sheets &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: collector
    env:
      APPLE_REGIONAL_VALIDATED: ${{ vars.APPLE_REGIONAL_VALIDATED }}
      GOOGLE_SHEETS_SPREADSHEET_ID: ${{ vars.GOOGLE_SHEETS_SPREADSHEET_ID }}
      GOOGLE_SHEETS_RANKINGS_TAB: ${{ vars.GOOGLE_SHEETS_RANKINGS_TAB || 'HoYoRankHistory' }}
      GOOGLE_SHEETS_STATUSES_TAB: ${{ vars.GOOGLE_SHEETS_STATUSES_TAB || 'HoYoChartStatuses' }}
      GOOGLE_WIF_PROVIDER: ${{ vars.GOOGLE_WIF_PROVIDER }}
      GOOGLE_SERVICE_ACCOUNT: ${{ vars.GOOGLE_SERVICE_ACCOUNT }}
      SOURCE_RUN_ID: ${{ needs.prepare.outputs.source_run_id }}
      SOURCE_ATTEMPT: ${{ needs.prepare.outputs.source_attempt }}
      COLLECTION_DATE: ${{ inputs.collection_date }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check explicit publishing setup
        run: |
          python - <<'PY'
          import os
          if os.environ.get("APPLE_REGIONAL_VALIDATED") != "true":
              raise SystemExit("Set APPLE_REGIONAL_VALIDATED=true after data validation.")
          required = ("GOOGLE_SHEETS_SPREADSHEET_ID", "GOOGLE_WIF_PROVIDER", "GOOGLE_SERVICE_ACCOUNT")
          missing = [key for key in required if not os.environ.get(key)]
          if missing:
              raise SystemExit("Configure repository variables: " + ", ".join(missing))
          PY
      - name: Install upload-only authentication dependency
        run: python -m pip install -r requirements-sheets.txt
      - uses: actions/download-artifact@v4
        with:
          name: apple-hoyoverse-history-${{ github.run_id }}
          path: collector/data/apple-history
      - name: Authenticate to Google through short-lived federation
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WIF_PROVIDER }}
          service_account: ${{ vars.GOOGLE_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - name: Import the saved daily snapshot with duplicate protection
        run: >-
          python -m game_observatory.apple_history --input data/apple-history
          --source-run-id "$SOURCE_RUN_ID" --source-attempt "$SOURCE_ATTEMPT"
          --collection-date "$COLLECTION_DATE" --publish
