name: Steam diagnostics checks

on:
  push:
    paths:
      - "collector/**"
      - "api/**"
      - "frontend/**"
      - "vercel.json"
      - ".github/workflows/steam-diagnostics.yml"
      - ".github/workflows/steam-test-dataset.yml"
      - ".github/workflows/steam-daily-sheets.yml"
  pull_request:
    paths:
      - "collector/**"
      - "api/**"
      - "frontend/**"
      - "vercel.json"
      - ".github/workflows/steam-diagnostics.yml"
      - ".github/workflows/steam-test-dataset.yml"
      - ".github/workflows/steam-daily-sheets.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collector-and-endpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test collectors and protected HTTP endpoint offline
        working-directory: collector
        run: python -m unittest discover -s tests -v
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  sheets-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify authentication imports and gated workflow structure
        run: |
          python -m pip install -r collector/requirements-sheets.txt "PyYAML>=6,<7"
          python - <<'PY'
          from pathlib import Path
          from google.auth.transport.requests import AuthorizedSession
          import yaml
          w = yaml.load(Path(".github/workflows/steam-daily-sheets.yml").read_text(), Loader=yaml.BaseLoader)
          assert set(w["on"]) == {"schedule", "workflow_dispatch"}
          assert w["on"]["schedule"] == [{"cron": "22 18 * * *"}]
          assert w["on"]["workflow_dispatch"]["inputs"]["publish_to_sheets"]["default"] == "false"
          assert "STEAM_SHEETS_DAILY_ENABLED" in w["jobs"]["collect"]["if"]
          assert "STEAM_SHEETS_DAILY_ENABLED" in w["jobs"]["publish"]["if"]
          assert "refs/heads/main" in w["jobs"]["publish"]["if"]
          assert w["jobs"]["publish"]["permissions"]["id-token"] == "write"
          assert w["concurrency"]["cancel-in-progress"] == "false"
          steps = w["jobs"]["collect"]["steps"] + w["jobs"]["publish"]["steps"]
          uploads = [s["with"] for s in steps if s.get("uses", "").startswith("actions/upload-artifact@")]
          downloads = [s["with"] for s in steps if s.get("uses", "").startswith("actions/download-artifact@")]
          assert uploads[0]["name"] == downloads[0]["name"]
          assert "run_attempt" not in uploads[0]["name"] and uploads[0]["overwrite"] == "true"
          assert "GOOGLE_SHEETS_SPREADSHEET_ID" not in w["jobs"]["publish"]["env"]
          print("Steam upload imports, schedule gates, main-only publishing and retry artifact verified.")
          PY
