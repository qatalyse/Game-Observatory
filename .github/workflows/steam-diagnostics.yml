name: Steam diagnostics checks

on:
  push:
    paths:
      - "collector/**"
      - "api/**"
      - "frontend/**"
      - "vercel.json"
      - ".github/workflows/steam-diagnostics.yml"
  pull_request:
    paths:
      - "collector/**"
      - "api/**"
      - "frontend/**"
      - "vercel.json"
      - ".github/workflows/steam-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collector-and-endpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test collectors and protected HTTP endpoint offline
        working-directory: collector
        run: python -m unittest discover -s tests -v
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
